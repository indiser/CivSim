{# Jinja2 macro: Kingdom skeleton loader — gold-shimmer version matching new card layout #}
{% macro nation_skeleton() %}
<article class="nation-card noise-panel animate-pulse" style="border-left-color: #243044; cursor: default; animation-delay: 0s;">
  <div class="kingdom-card-header">
    <!-- Crest placeholder -->
    <div style="width:30px;height:30px;border-radius:50%;background:rgba(36,48,68,0.6);border:1px solid rgba(36,48,68,0.9);flex-shrink:0;" class="nation-skeleton-bar"></div>
    <div style="flex:1;">
      <!-- Name placeholder -->
      <div class="nation-skeleton-bar h-5 rounded" style="width:96px;height:12px;margin-bottom:5px;border-radius:4px;"></div>
      <!-- Ideology badge placeholder -->
      <div class="nation-skeleton-bar h-4 rounded-full" style="width:52px;height:9px;border-radius:3px;"></div>
    </div>
    <!-- Power badge placeholder -->
    <div class="nation-skeleton-bar h-5 rounded" style="width:30px;height:28px;border-radius:5px;"></div>
  </div>

  <div class="card-stat-bars" style="gap:5px;margin-bottom:9px;">
    <div class="nation-skeleton-bar" style="height:4px;border-radius:2px;width:100%;"></div>
    <div class="nation-skeleton-bar" style="height:4px;border-radius:2px;width:86%;"></div>
    <div class="nation-skeleton-bar" style="height:4px;border-radius:2px;width:93%;"></div>
    <div class="nation-skeleton-bar" style="height:4px;border-radius:2px;width:70%;"></div>
    <div class="nation-skeleton-bar" style="height:4px;border-radius:2px;width:78%;"></div>
  </div>

  <div class="nation-skeleton-bar h-3 rounded" style="width:55%;height:8px;border-radius:3px;"></div>
</article>
{% endmacro %}
