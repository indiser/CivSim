{# Jinja2 macro: Kingdom skeleton loader — gold-shimmer version matching new card layout #}
{% macro nation_skeleton() %}
<article class="nation-card noise-panel animate-pulse" style="border-left-color: #2a3347; cursor: default;">
  <div class="kingdom-card-header">
    <div style="width:26px;height:26px;border-radius:50%;background:#1e2433;border:1px solid #2a3347;flex-shrink:0;"></div>
    <div style="flex:1;">
      <div class="h-5 rounded" style="width:100px;margin-bottom:4px;border-radius:4px;"></div>
      <div class="h-4 rounded-full" style="width:56px;border-radius:3px;"></div>
    </div>
    <div style="width:28px;height:22px;border-radius:4px;" class="h-5 rounded"></div>
  </div>
  <div class="card-stat-bars" style="gap:4px;margin-bottom:7px;">
    <div style="height:5px;border-radius:2px;width:100%;" class="h-4 rounded"></div>
    <div style="height:5px;border-radius:2px;width:88%;"  class="h-4 rounded"></div>
    <div style="height:5px;border-radius:2px;width:94%;"  class="h-4 rounded"></div>
    <div style="height:5px;border-radius:2px;width:72%;"  class="h-4 rounded"></div>
    <div style="height:5px;border-radius:2px;width:80%;"  class="h-4 rounded"></div>
  </div>
  <div class="h-3 rounded" style="width:60%;border-radius:3px;"></div>
</article>
{% endmacro %}
